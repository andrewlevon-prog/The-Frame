<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ViziOptic — Try-On Test</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#080a0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#080a0f;position:relative;z-index:3}
  .brand{font-weight:700;font-size:21px;letter-spacing:.2px}
  .sub{font-size:12px;color:#9aa5b8;margin-top:2px}
  button{border:0;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:600;background:#fff;color:#101522}
  #stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  video{transform:scaleX(-1)}
  #canvas{pointer-events:none}
  #status{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:2;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-size:13px;white-space:nowrap}
  #error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:4;background:#000}
  #error .box{max-width:360px}
  #error h2{margin:0 0 10px;font-size:25px}
  #error p{color:#aeb7c7;line-height:1.5}
  #bottom{height:96px;display:flex;align-items:center;justify-content:center;gap:12px;background:#080a0f;position:relative;z-index:3}
  #photo{width:62px;height:62px;border-radius:50%;padding:0;background:#fff;border:5px solid #222;box-shadow:0 0 0 2px #fff}
  #retry{display:none}
  .hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;color:#c5cbd6;font-size:12px;background:rgba(0,0,0,.5);padding:7px 11px;border-radius:999px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><div class="brand">ViziOptic</div><div class="sub">Virtual Eyewear Try-On · TEST 01</div></div>
    <button id="close">Close</button>
  </header>

  <main id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="status">Підготовка камери…</div>
    <div class="hint">Дивись прямо в камеру 👓</div>

    <div id="error">
      <div class="box">
        <h2>Не вдалося запустити примірку</h2>
        <p id="errorText">Перевір дозвіл на камеру та відкрий сторінку через HTTPS.</p>
        <button id="retry">Спробувати ще раз</button>
      </div>
    </div>
  </main>

  <div id="bottom">
    <button id="photo" aria-label="Зробити фото"></button>
  </div>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const errorBox = document.getElementById("error");
const errorText = document.getElementById("errorText");
const retry = document.getElementById("retry");
const photo = document.getElementById("photo");

let landmarker;
let stream;
let running = false;
let lastVideoTime = -1;
let glassesImg = new Image();

const glassesSvg = `
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe6ef" stop-opacity=".80"/>
      <stop offset="1" stop-color="#9daabd" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <g fill="url(#lens)" stroke="#111827" stroke-width="15" stroke-linejoin="round">
    <path d="M75 75 Q90 55 125 55 H355 Q390 55 400 85 L380 195 Q375 225 340 230 H130 Q95 225 90 195 Z"/>
    <path d="M500 85 Q510 55 545 55 H775 Q810 55 825 75 L810 195 Q805 225 770 230 H560 Q525 225 520 195 Z"/>
  </g>
  <path d="M400 95 Q450 65 500 95" fill="none" stroke="#111827" stroke-width="15"/>
  <path d="M75 105 H20 M825 105 H880" stroke="#111827" stroke-width="15" stroke-linecap="round"/>
</svg>`;

glassesImg.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(glassesSvg);

async function init() {
  try {
    status.textContent = "Запит доступу до камери…";
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    status.textContent = "Завантажую Face Landmarker…";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );

    landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
      },
      runningMode: "VIDEO",
      numFaces: 1,
      minFaceDetectionConfidence: 0.5,
      minFacePresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    status.textContent = "Готово — дивись у камеру 👓";
    running = true;
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    errorText.textContent = e?.message || "Помилка запуску камери.";
    errorBox.style.display = "flex";
    status.style.display = "none";
    retry.style.display = "inline-block";
  }
}

function loop() {
  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = video.videoWidth || 1280;
    const h = video.videoHeight || 720;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = "100%";
    canvas.style.height = "100%";

    const result = landmarker.detectForVideo(video, performance.now());

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.scale(dpr, dpr);

    if (result.faceLandmarks?.length) {
      const lm = result.faceLandmarks[0];

      // Front camera is mirrored visually, so mirror landmark X too.
      const p = (i) => ({
        x: (1 - lm[i].x) * w,
        y: lm[i].y * h
      });

      const left = p(263);
      const right = p(33);

      const cx = (left.x + right.x) / 2;
      const cy = (left.y + right.y) / 2;
      const eyeDist = Math.hypot(left.x - right.x, left.y - right.y);
      const angle = Math.atan2(left.y - right.y, left.x - right.x);

      // Temporary calibration for the test glasses.
      const glassesWidth = eyeDist * 2.75;
      const glassesHeight = glassesWidth * (300 / 900);

      ctx.save();
      ctx.translate(cx, cy + eyeDist * 0.10);
      ctx.rotate(angle);
      ctx.drawImage(
        glassesImg,
        -glassesWidth / 2,
        -glassesHeight / 2,
        glassesWidth,
        glassesHeight
      );
      ctx.restore();

      status.textContent = "Обличчя знайдено ✓";
    } else {
      status.textContent = "Дивись прямо в камеру…";
    }

    ctx.restore();
  }

  requestAnimationFrame(loop);
}

photo.addEventListener("click", () => {
  if (!video.videoWidth) return;

  const out = document.createElement("canvas");
  out.width = video.videoWidth;
  out.height = video.videoHeight;
  const c = out.getContext("2d");

  c.save();
  c.scale(-1, 1);
  c.drawImage(video, -out.width, 0, out.width, out.height);
  c.restore();

  // Re-draw current overlay from the visible canvas.
  c.drawImage(canvas, 0, 0, out.width, out.height);

  const a = document.createElement("a");
  a.href = out.toDataURL("image/jpeg", .92);
  a.download = "vizioptic-try-on.jpg";
  a.click();
});

retry.addEventListener("click", () => location.reload());

document.getElementById("close").addEventListener("click", () => {
  running = false;
  stream?.getTracks().forEach(t => t.stop());
  history.back();
});

init();
</script>
</body>
</html>
