<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Frame — Camera Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090a0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{padding:18px 20px 16px;background:#090a0d}
.brand{font-size:25px;font-weight:700}.sub{margin-top:4px;color:#9ca2ad}
#stage{position:relative;flex:1;background:#111;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
#status{position:absolute;top:25px;left:50%;transform:translateX(-50%);z-index:5;background:#000;padding:13px 18px;border-radius:25px;font-size:16px;white-space:nowrap}
#bottom{height:155px;display:flex;justify-content:center;align-items:center;background:#090a0d}
#cameraBtn{position:relative;z-index:20;width:92px;height:92px;border-radius:50%;border:8px solid #30343d;background:#fff;padding:0;display:block;touch-action:manipulation;-webkit-appearance:none}
#cameraBtn:active{transform:scale(.94)}
#err{position:absolute;z-index:10;left:18px;right:18px;top:90px;background:#2a1215;border:1px solid #70343c;border-radius:16px;padding:16px;display:none}
#retry{margin-top:12px;padding:10px 16px;border:0;border-radius:10px;background:#fff;color:#111;font-size:16px}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">The Frame</div><div class="sub">Virtual Try-On · CAMERA TEST</div></header>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Натисни білу кнопку</div>
  <div id="err"><div id="errText"></div><button id="retry" type="button" onclick="startCamera()">Спробувати ще раз</button></div>
</div>
<div id="bottom">
  <button id="cameraBtn" type="button" onclick="startCamera()" aria-label="Увімкнути камеру"></button>
</div>
</div>

<script>
function startCamera(){
  const status=document.getElementById('status');
  const err=document.getElementById('err');
  const errText=document.getElementById('errText');
  const video=document.getElementById('video');
  const btn=document.getElementById('cameraBtn');

  status.textContent='Кнопка працює — запитую камеру…';
  err.style.display='none';

  if(!window.isSecureContext){
    errText.textContent='Сторінка відкрита не через HTTPS.';
    err.style.display='block'; return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    errText.textContent='Цей браузер не підтримує доступ до камери на цій сторінці.';
    err.style.display='block'; return;
  }

  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},
    audio:false
  }).then(function(stream){
    video.srcObject=stream;
    video.style.display='block';
    return video.play();
  }).then(function(){
    status.textContent='Камера працює ✓';
    btn.style.display='none';
  }).catch(function(e){
    let t='Помилка запуску камери: '+(e.name||'невідома помилка');
    if(e.name==='NotAllowedError') t='Доступ до камери заборонено. Потрібно дозволити камеру для цього сайту.';
    if(e.name==='NotFoundError') t='Камеру не знайдено.';
    if(e.name==='NotReadableError') t='Камера зараз зайнята іншою програмою.';
    errText.textContent=t;
    err.style.display='block';
    status.textContent='Камеру не запущено';
  });
}
</script>
</body>
</html>
