<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Frame — Face Tracking Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:82px;padding:18px 20px;background:#08090d;border-bottom:1px solid #191b20;z-index:10}
.brand{font-size:25px;font-weight:700}.sub{font-size:14px;color:#9ca2ad;margin-top:4px}
#stage{position:relative;flex:1;overflow:hidden;background:#111}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
#status{position:absolute;z-index:5;top:24px;left:50%;transform:translateX(-50%);background:#000;padding:12px 18px;border-radius:24px;font-size:16px;white-space:nowrap}
#bottom{height:145px;background:#08090d;display:flex;align-items:center;justify-content:center;z-index:10}
#cameraBtn{width:88px;height:88px;border-radius:50%;border:8px solid #30343d;background:#fff;padding:0;touch-action:manipulation}
#cameraBtn:active{transform:scale(.94)}
#err{position:absolute;z-index:20;left:18px;right:18px;top:88px;background:#291316;border:1px solid #6e353d;border-radius:16px;padding:16px;display:none}
#retry{margin-top:12px;border:0;border-radius:10px;padding:10px 16px;background:#fff;color:#111;font-size:16px}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">The Frame</div>
  <div class="sub">Virtual Try-On · FACE TRACKING TEST</div>
</header>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="status">Натисни кнопку, щоб почати</div>
  <div id="err"><div id="errText"></div><button id="retry" type="button">Спробувати ще раз</button></div>
</div>
<div id="bottom">
  <button id="cameraBtn" type="button" aria-label="Увімкнути камеру"></button>
</div>
</div>

<script type="module">
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const status = document.getElementById("status");
const btn = document.getElementById("cameraBtn");
const err = document.getElementById("err");
const errText = document.getElementById("errText");
const retry = document.getElementById("retry");

let landmarker = null;
let stream = null;
let lastRun = 0;
let started = false;

const MODEL =
  "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

function showError(text){
  errText.textContent = text;
  err.style.display = "block";
  status.style.display = "none";
}

function resizeCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(stage.clientWidth * dpr);
  canvas.height = Math.round(stage.clientHeight * dpr);
  canvas.style.width = stage.clientWidth + "px";
  canvas.style.height = stage.clientHeight + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resizeCanvas);

function mapPoint(p){
  const vw = video.videoWidth, vh = video.videoHeight;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if(!vw || !vh) return {x:0,y:0};

  const scale = Math.max(sw/vw, sh/vh);
  const drawW = vw*scale, drawH = vh*scale;
  const ox = (sw-drawW)/2, oy = (sh-drawH)/2;

  // Video is visually mirrored, so mirror the landmark x coordinate too.
  return {
    x: ox + (1-p.x)*drawW,
    y: oy + p.y*drawH
  };
}

function drawTracking(landmarks){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  ctx.clearRect(0,0,sw,sh);

  // A few stable face points — this is our first visual proof that tracking works.
  const indices = [33,133,362,263,468,473,1,61,291];
  ctx.fillStyle = "#ffffff";
  for(const i of indices){
    if(!landmarks[i]) continue;
    const p = mapPoint(landmarks[i]);
    ctx.beginPath();
    ctx.arc(p.x,p.y,3.5,0,Math.PI*2);
    ctx.fill();
  }

  // Temporary "virtual glasses" frame based on eye corners.
  // This will be replaced by the real product frame later.
  if(landmarks[33] && landmarks[133] && landmarks[362] && landmarks[263]){
    const a=mapPoint(landmarks[33]);
    const b=mapPoint(landmarks[133]);
    const c=mapPoint(landmarks[362]);
    const d=mapPoint(landmarks[263]);

    const leftW=Math.hypot(a.x-b.x);
    const rightW=Math.hypot(c.x-d.x);
    const pad=Math.max(leftW,rightW)*0.22;

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=3;
    ctx.lineJoin="round";

    function frame(p1,p2,w){
      const dx=p2.x-p1.x, dy=p2.y-p1.y;
      const len=Math.hypot(dx,dy)||1;
      const nx=-dy/len, ny=dx/len;
      const q1={x:p1.x-nx*pad,y:p1.y-ny*pad};
      const q2={x:p2.x-nx*pad,y:p2.y-ny*pad};
      const q3={x:p2.x+nx*pad,y:p2.y+ny*pad};
      const q4={x:p1.x+nx*pad,y:p1.y+ny*pad};
      ctx.beginPath();
      ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);
      ctx.lineTo(q3.x,q3.y);ctx.lineTo(q4.x,q4.y);
      ctx.closePath();ctx.stroke();
    }
    frame(a,b,leftW);
    frame(c,d,rightW);

    const bridgeY=(b.y+c.y)/2;
    ctx.beginPath();
    ctx.moveTo(b.x,bridgeY);
    ctx.quadraticCurveTo((b.x+c.x)/2,bridgeY-5,(c.x),bridgeY);
    ctx.stroke();
  }
}

async function loadLandmarker(){
  status.textContent="Завантажую розпізнавання обличчя…";

  // Import the official MediaPipe Tasks Vision package from jsDelivr.
  const {FilesetResolver, FaceLandmarker} =
    await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
  );

  landmarker = await FaceLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:MODEL},
    runningMode:"VIDEO",
    numFaces:1,
    minFaceDetectionConfidence:0.5,
    minFacePresenceConfidence:0.5,
    minTrackingConfidence:0.5
  });
}

function loop(now){
  if(!started || !landmarker) return;

  if(video.readyState >= 2 && now-lastRun > 80){
    lastRun=now;
    try{
      const result=landmarker.detectForVideo(video,now);
      if(result.faceLandmarks && result.faceLandmarks.length){
        drawTracking(result.faceLandmarks[0]);
        status.textContent="Обличчя знайдено ✓";
      }else{
        ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
        status.textContent="Не бачу обличчя — подивись у камеру";
      }
    }catch(e){
      console.error(e);
    }
  }
  requestAnimationFrame(loop);
}

async function start(){
  err.style.display="none";
  status.style.display="block";
  status.textContent="Запитую камеру…";

  try{
    if(!window.isSecureContext) throw new Error("HTTPS_REQUIRED");
    if(!navigator.mediaDevices?.getUserMedia) throw new Error("NO_CAMERA_API");

    if(!stream){
      stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:"user"},
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });
      video.srcObject=stream;
      await video.play();
    }

    resizeCanvas();
    btn.style.display="none";
    status.textContent="Камера працює. Готую Face Tracking…";

    if(!landmarker) await loadLandmarker();

    started=true;
    requestAnimationFrame(loop);
  }catch(e){
    console.error(e);
    let msg="Не вдалося запустити тест.";
    if(e.message==="HTTPS_REQUIRED") msg="Потрібно відкрити сайт через HTTPS.";
    else if(e.message==="NO_CAMERA_API") msg="Браузер не надає доступ до камери.";
    else if(e.name==="NotAllowedError") msg="Доступ до камери заборонено.";
    else if(e.name==="NotFoundError") msg="Камеру не знайдено.";
    else if(e.name==="NotReadableError") msg="Камера зайнята іншою програмою.";
    else if(e.message) msg += " " + e.message;
    showError(msg);
  }
}

btn.addEventListener("click",start);
retry.addEventListener("click",start);
</script>
</body>
</html>
