<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Frame — Virtual Try-On</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:82px;padding:18px 20px;background:#08090d;border-bottom:1px solid #191b20;z-index:10}
.brand{font-size:25px;font-weight:700}.sub{font-size:14px;color:#9ca2ad;margin-top:4px}
#stage{position:relative;flex:1;overflow:hidden;background:#111}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas{pointer-events:none}
#status{position:absolute;z-index:5;top:24px;left:50%;transform:translateX(-50%);background:#000;padding:12px 18px;border-radius:24px;font-size:16px;white-space:nowrap}
#bottom{height:145px;background:#08090d;display:flex;align-items:center;justify-content:center;z-index:10}
#cameraBtn{width:88px;height:88px;border-radius:50%;border:8px solid #30343d;background:#fff;padding:0;touch-action:manipulation}
#cameraBtn:active{transform:scale(.94)}
#err{position:absolute;z-index:20;left:18px;right:18px;top:88px;background:#291316;border:1px solid #6e353d;border-radius:16px;padding:16px;display:none}
#retry{margin-top:12px;border:0;border-radius:10px;padding:10px 16px;background:#fff;color:#111;font-size:16px}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">The Frame</div><div class="sub">Virtual Try-On · GUCCI TEST</div></header>
<div id="stage">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="status">Натисни кнопку, щоб почати</div>
<div id="err"><div id="errText"></div><button id="retry" type="button">Спробувати ще раз</button></div>
</div>
<div id="bottom"><button id="cameraBtn" type="button" aria-label="Увімкнути камеру"></button></div>
</div>

<script type="module">
const video=document.getElementById("video");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const stage=document.getElementById("stage");
const status=document.getElementById("status");
const btn=document.getElementById("cameraBtn");
const err=document.getElementById("err");
const errText=document.getElementById("errText");
const retry=document.getElementById("retry");

const glasses=new Image();
glasses.src="./gucci_front.jpg";

let landmarker=null,stream=null,started=false,lastRun=0;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(stage.clientWidth*dpr);
  canvas.height=Math.round(stage.clientHeight*dpr);
  canvas.style.width=stage.clientWidth+"px";
  canvas.style.height=stage.clientHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);

function point(p){
  const vw=video.videoWidth,vh=video.videoHeight,sw=stage.clientWidth,sh=stage.clientHeight;
  const scale=Math.max(sw/vw,sh/vh),dw=vw*scale,dh=vh*scale;
  const ox=(sw-dw)/2,oy=(sh-dh)/2;
  return {x:ox+(1-p.x)*dw,y:oy+p.y*dh};
}

function drawGlasses(lm){
  ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
  if(!glasses.complete || !glasses.naturalWidth) return;

  const le=point(lm[33]), li=point(lm[133]);
  const ri=point(lm[362]), re=point(lm[263]);
  const leftEye={x:(le.x+li.x)/2,y:(le.y+li.y)/2};
  const rightEye={x:(ri.x+re.x)/2,y:(ri.y+re.y)/2};

  const eyeDist=Math.hypot(rightEye.x-leftEye.x,rightEye.y-leftEye.y);
  const angle=Math.atan2(rightEye.y-leftEye.y,rightEye.x-leftEye.x);

  // The source image is 830 px wide. Its two eye centers are ~200 and ~620 px.
  const targetWidth=eyeDist*2.08;
  const targetHeight=targetWidth*(glasses.naturalHeight/glasses.naturalWidth);

  const cx=(leftEye.x+rightEye.x)/2;
  const cy=(leftEye.y+rightEye.y)/2;

  ctx.save();
  ctx.translate(cx,cy+eyeDist*0.01);
  ctx.rotate(angle);
  ctx.globalAlpha=0.98;
  // Multiply makes the white studio background visually disappear.
  ctx.globalCompositeOperation="multiply";
  ctx.drawImage(glasses,-targetWidth/2,-targetHeight*0.50,targetWidth,targetHeight);
  ctx.restore();

  ctx.globalCompositeOperation="source-over";
}

async function loadTracking(){
  status.textContent="Завантажую Face Tracking…";
  const {FilesetResolver,FaceLandmarker}=await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs"
  );
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
  );
  landmarker=await FaceLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"VIDEO",numFaces:1,
    minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5,minTrackingConfidence:.5
  });
}

function loop(now){
  if(!started||!landmarker)return;
  if(video.readyState>=2&&now-lastRun>70){
    lastRun=now;
    try{
      const r=landmarker.detectForVideo(video,now);
      if(r.faceLandmarks?.length){
        drawGlasses(r.faceLandmarks[0]);
        status.textContent="Обличчя знайдено ✓";
      }else{
        ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);
        status.textContent="Подивись прямо в камеру";
      }
    }catch(e){console.error(e)}
  }
  requestAnimationFrame(loop);
}

async function start(){
  err.style.display="none";status.style.display="block";
  try{
    if(!isSecureContext)throw Error("HTTPS_REQUIRED");
    if(!navigator.mediaDevices?.getUserMedia)throw Error("NO_CAMERA_API");
    if(!stream){
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:"user"},width:{ideal:1280},height:{ideal:720}},audio:false
      });
      video.srcObject=stream;
      await video.play();
    }
    resize();
    if(!glasses.complete)await new Promise(r=>{glasses.onload=r});
    btn.style.display="none";
    await loadTracking();
    started=true;
    status.textContent="Готово — дивись у камеру";
    requestAnimationFrame(loop);
  }catch(e){
    let m="Помилка запуску.";
    if(e.name==="NotAllowedError")m="Дозвіл на камеру заборонено.";
    else if(e.message==="HTTPS_REQUIRED")m="Потрібен HTTPS.";
    else if(e.message==="NO_CAMERA_API")m="Камера недоступна.";
    else if(e.message)m+=" "+e.message;
    errText.textContent=m;err.style.display="block";status.style.display="none";
  }
}
btn.onclick=start;retry.onclick=start;
</script>
</body>
</html>
