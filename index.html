<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Frame — Camera Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0b0c10}
.brand{font-size:21px;font-weight:700}.sub{font-size:12px;color:#9ca3af;margin-top:2px}
#stage{position:relative;flex:1;overflow:hidden;background:#111}
video{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;transform:scaleX(-1)}
#message{position:absolute;z-index:2;left:50%;top:20px;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:10px 15px;border-radius:20px;white-space:nowrap;font-size:14px}
#error{display:none;position:absolute;z-index:4;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;background:#000}
.box{max-width:360px}.box h2{font-size:24px;margin:0 0 12px}.box p{color:#aeb5c2;line-height:1.5}
button{border:0;border-radius:15px;padding:13px 18px;font-weight:600;font-size:15px}
#start{background:#fff;color:#111;margin-top:8px}
#bottom{height:105px;background:#0b0c10;display:flex;align-items:center;justify-content:center}
#capture{width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid #30343c}
</style>
</head>
<body>
<header>
  <div><div class="brand">The Frame</div><div class="sub">Virtual Try-On · CAMERA TEST</div></div>
</header>

<main id="stage">
  <video id="video" playsinline autoplay muted></video>
  <div id="message">Натисни кнопку, щоб увімкнути камеру</div>

  <div id="error">
    <div class="box">
      <h2>Камера не запустилась</h2>
      <p id="errorText"></p>
      <button id="start">Спробувати ще раз</button>
    </div>
  </div>
</main>

<footer id="bottom">
  <button id="capture" aria-label="Зробити фото"></button>
</footer>

<script>
const video=document.getElementById('video');
const message=document.getElementById('message');
const error=document.getElementById('error');
const errorText=document.getElementById('errorText');
const start=document.getElementById('start');
let stream=null;

async function startCamera(){
  error.style.display='none';
  message.style.display='block';
  message.textContent='Запитую доступ до камери…';

  try{
    if(!window.isSecureContext){
      throw new Error('Сайт відкрито не через HTTPS. Відкрий саме посилання GitHub Pages.');
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('Цей браузер не надав доступ до камери для цієї сторінки.');
    }

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    message.textContent='Камера працює ✓';
  }catch(e){
    console.error(e);
    message.style.display='none';
    errorText.textContent=(e && e.message) ? e.message : 'Невідома помилка запуску камери.';
    error.style.display='flex';
  }
}

start.addEventListener('click',startCamera);

document.getElementById('capture').addEventListener('click',()=>{
  if(!video.videoWidth)return;
  const c=document.createElement('canvas');
  c.width=video.videoWidth;c.height=video.videoHeight;
  const x=c.getContext('2d');
  x.save();x.scale(-1,1);x.drawImage(video,-c.width,0,c.width,c.height);x.restore();
  const a=document.createElement('a');
  a.href=c.toDataURL('image/jpeg',.92);
  a.download='the-frame-camera-test.jpg';
  a.click();
});
</script>
</body>
</html>
